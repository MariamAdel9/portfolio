<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mariam - Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

            sectionName="Experience"
            sectionDesc="Work Experience"
          ></app-section>
          <app-exp></app-exp>

          <app-section
            sectionName="Projects"
            sectionDesc="Selected Work"

          <app-project-card></app-project-card>

          <app-section sectionName="Education & Certifications"></app-section>
          <app-cert></app-cert>

        <div id="contact">
          <app-section sectionName="Contact info & socials"></app-section>
          <div class="contact-info">
            <a href="mailto:mariamak98@outlook.com">mariamak98@outlook.com</a>
